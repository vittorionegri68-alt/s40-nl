# Tells IndexNow (Bing, Yandex, Seznam, Naver; not Google) that content changed.
# Fires on deployment_status, not on push, so the crawler never arrives while the
# previous build is still the one being served.
name: IndexNow

on:
  deployment_status:

jobs:
  notify:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Skip when the commit touched no content
        id: gate
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(index\.html|public/|src/data/|src/config/)'; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Submit the sitemap URLs to IndexNow
        if: steps.gate.outputs.run == 'true'
        run: |
          HOST="https://s40.nl"
          KEY="e3e4dcddad16ebc9ccf8508b20b95082"
          URLS=$(curl -sS --max-time 20 "$HOST/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -e 's/<loc>//' -e 's|</loc>||')
          COUNT=$(echo "$URLS" | grep -c . || true)
          echo "URL da segnalare: $COUNT"
          [ "$COUNT" -eq 0 ] && { echo "sitemap vuota o irraggiungibile, esco senza errore"; exit 0; }
          LIST=$(echo "$URLS" | sed 's/.*/"&"/' | paste -sd, -)
          BODY="{\"host\":\"${HOST#https://}\",\"key\":\"$KEY\",\"keyLocation\":\"$HOST/$KEY.txt\",\"urlList\":[$LIST]}"
          CODE=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" --data "$BODY")
          echo "HTTP $CODE"; cat /tmp/out.txt
          case "$CODE" in 200|202) exit 0 ;; *) echo "IndexNow ha rifiutato la segnalazione"; exit 1 ;; esac

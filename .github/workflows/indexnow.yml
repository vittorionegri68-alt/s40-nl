# Tells IndexNow (Bing, Yandex, Seznam, Naver; not Google) that content changed.
#
# On the other eight domains this fires on deployment_status, so it never points a
# crawler at a build that is not live yet. These two repos do not emit that event:
# on 24/11/2026 the GitHub deployments API was empty for both and no run was ever
# queued. The trigger is kept in case the Vercel integration starts sending it, and
# push is the one that actually works here, with a wait so the deploy lands first.
# workflow_dispatch allows a manual run after a content change made outside a push.
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'src/data/**'
      - 'src/config/**'

      - '.github/**'
jobs:
  controlla:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Lascia il tempo al deploy di andare online
        if: github.event_name == 'push'
        run: sleep 90

      - name: Checkout del commit deployato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Controlla che il sito sia indicizzabile
        env:
          SITE_URL: https://s40.nl
        run: node .github/scripts/check-indexability.mjs


  notify:
    needs: controlla
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Give the deploy time to go live
        if: github.event_name == 'push'
        run: sleep 90

      - name: Submit the sitemap URLs to IndexNow
        run: |
          HOST="https://s40.nl"
          KEY="e3e4dcddad16ebc9ccf8508b20b95082"
          URLS=$(curl -sS --max-time 20 "$HOST/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -e 's/<loc>//' -e 's|</loc>||')
          COUNT=$(echo "$URLS" | grep -c . || true)
          echo "URL da segnalare: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "sitemap vuota o irraggiungibile, esco senza errore"; exit 0; fi
          LIST=$(echo "$URLS" | sed 's/.*/"&"/' | paste -sd, -)
          BODY="{\"host\":\"${HOST#https://}\",\"key\":\"$KEY\",\"keyLocation\":\"$HOST/$KEY.txt\",\"urlList\":[$LIST]}"
          CODE=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" --data "$BODY")
          echo "HTTP $CODE"; cat /tmp/out.txt
          case "$CODE" in 200|202) exit 0 ;; *) echo "IndexNow ha rifiutato la segnalazione"; exit 1 ;; esac
